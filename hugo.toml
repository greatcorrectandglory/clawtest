baseURL = "https://crossthewall.org/"
languageCode = "zh-CN"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
summaryLength = 100
title = "碳基人的小站"
theme = "PaperMod"

# 主站由本机 Nginx 提供；保留备用镜像的 baseURL 兼容性
relativeURLs = false

enableRobotsTXT = true

author = "碳基人"

timeZone = "Asia/Shanghai"

[params]
  description = "碳基人的个人网站，分享软件开发、AI 工具实践与自动化测试平台建设，记录项目经验、效率方法和生活成长。"
  author = "碳基人"
  images = ["images/avatar.png"]
  locale = "zh_CN"
  DateFormat = "2006-01-02"
  comments = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowShareButtons = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = true

  defaultTheme = "auto" # auto | dark | light
  disableThemeToggle = false

  # 个人品牌首页（Profile Mode）
  [params.profileMode]
    enabled = true
    title = "碳基人"
    subtitle = "软件开发 / 自动化测试平台 / AI 工具实践"
    imageUrl = "/images/avatar.svg"
    imageTitle = "碳基人个人网站头像"
    imageWidth = 140
    imageHeight = 140

    [[params.profileMode.buttons]]
      name = "测试平台"
      url = "https://crossthewall.org/test-platform/"

    [[params.profileMode.buttons]]
      name = "博客"
      url = "posts/"

    [[params.profileMode.buttons]]
      name = "项目"
      url = "projects/"

    [[params.profileMode.buttons]]
      name = "工作"
      url = "work/"

    [[params.profileMode.buttons]]
      name = "关于我"
      url = "about/"

  # 社交链接（按需改成你自己的）
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/greatcorrectandglory"


[menu]
  [[menu.main]]
    identifier = "test-platform"
    name = "测试平台"
    url = "https://crossthewall.org/test-platform/"
    weight = 5

  [[menu.main]]
    identifier = "posts"
    name = "博客"
    url = "posts/"
    weight = 10

  [[menu.main]]
    identifier = "projects"
    name = "项目"
    url = "projects/"
    weight = 20

  [[menu.main]]
    identifier = "work"
    name = "工作"
    url = "work/"
    weight = 25

  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "about/"
    weight = 30

  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "search/"
    weight = 40


[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 30
  includeNewer = true
  [[related.indices]]
    name = "tags"
    weight = 100
