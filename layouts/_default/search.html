{{ define "main" }}
<header class="page-header"><h1>{{ .Title }}</h1><p>{{ .Description }}</p></header>
<div id="searchbox">
<label for="searchInput">关键词</label>
<input id="searchInput" type="search" placeholder="例如：测试平台、配置、AI 工具" autocomplete="off" maxlength="80" disabled>
<p id="searchStatus" role="status">正在加载搜索索引…</p>
<ul id="searchResults" aria-label="搜索结果"></ul>
</div>
<noscript>搜索需要启用 JavaScript；也可浏览<a href="{{ "posts/" | absURL }}">文章列表</a>。</noscript>
{{ end }}
